spring:
  application:
    name: platform

  config:
    import: optional:file:env.properties

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
jwt:
  auth:
    secret-key: ${JWT_SECRET}
    expiration-ms: 86400000  # 24 hours
    issuer: platform-service

logging:
  level:
    root: INFO
    com.finance.platform: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.web: DEBUG

forecast:
  base-url: ${FORECAST_URL:http://localhost:8000}
  internal-key: ${FORECAST_INTERNAL_KEY}

